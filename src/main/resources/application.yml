server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: rpa-manage-backend
  datasource:
    url: jdbc:mysql://localhost:3306/rpa_manage_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    issuer: rpa-manage-backend
    expiration-millis: 86400000
    secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
  playwright:
    headless: true
    timeout-millis: 30000
  upload:
    avatar-dir: uploads/avatars
  permission:
    cache-ttl-seconds: 1800
  task-executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
